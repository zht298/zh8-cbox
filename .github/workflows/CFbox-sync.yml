name: '更新CFbox'

on:
  schedule:
    # UTC 时间每天 02:10 触发 (即 Cron 表达式: 分 时 日 月 星期)
    - cron: '10 2 * * *'
  workflow_dispatch: # 允许手动手动触发运行

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write # 赋予提交和推送代码的权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest CFBox script
        run: |
          # 获取 Raw 文件内容并保存为 _worker.js
          curl -sSL "https://raw.githubusercontent.com/zht298/zh8-CFBox/main/CFBox混淆版.js" -o _worker.js

      - name: Commit and Push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 检查 _worker.js 是否有变动或新增
          if git status --porcelain _worker.js | grep -q .; then
            echo "发现文件更新，正在提交更改..."
            git add _worker.js
            git commit -m "Auto sync: update _worker.js from original repository"
            git push
          else
            echo "文件未发生变化，跳过提交。"
          fi
